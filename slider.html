<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Main Outer Container */
.slider-container {
  position: relative;
  max-width: 800px;
  margin: 40px auto;
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

/* Inner Frame containing the row of slides */
.slider-wrapper {
  width: 100%;
}

.slides {
  display: flex;
  width: 100%;
  transition: transform 0.5s ease-in-out;
}

.slide {
  width: 100%;
  flex-shrink: 0;
  object-fit: cover;
  display: block;
}

/* Navigation Arrow Styling */
.arrow-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(0, 0, 0, 0.5);
  color: #fff;
  border: none;
  font-size: 24px;
  padding: 12px 16px;
  cursor: pointer;
  border-radius: 50%;
  transition: background-color 0.3s ease;
  z-index: 10;
}

.arrow-btn:hover {
  background-color: rgba(0, 0, 0, 0.8);
}

.prev { left: 15px; }
.next { right: 15px; }

/* Dot Indicators Container */
.dots-container {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 10;
}

/* Individual Navigation Dot */
.dot {
  width: 12px;
  height: 12px;
  background-color: rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.3s ease;
}

.dot.active, .dot:hover {
  background-color: #fff;
  transform: scale(1.2);
}

/* Core Grid Trick Mechanics */
.dropdown-menu-wrapper {
  display: grid;
  /* 1. Start with 0 rows */
  grid-template-rows: 0fr; 
  /* 2. Animate the grid row template */
  transition: grid-template-rows 0.3s ease-out; 
}

/* When the parent has the .is-open class, transition to 1fr */
.dropdown.is-open .dropdown-menu-wrapper {
  grid-template-rows: 1fr;
}

/* Crucial step: Prevent inner content from breaking the 0px height */
.dropdown-menu-content {
  overflow: hidden;
}

/* Optional Styling for Polish */
.dropdown {
  position: relative;
  display: inline-block;
  font-family: sans-serif;
  width: 220px;
}

.dropdown-toggle {
  width: 100%;
  padding: 12px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dropdown-toggle .arrow {
  transition: transform 0.3s ease;
}

.dropdown.is-open .dropdown-toggle .arrow {
  transform: rotate(180deg);
}

.dropdown-menu-content {
  background: #f8f9fa;
  border: 1px solid #ddd;
  border-top: none;
  border-radius: 0 0 4px 4px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.dropdown-item {
  display: block;
  padding: 10px 15px;
  color: #333;
  text-decoration: none;
  transition: background 0.2s;
}

.dropdown-item:hover {
  background: #e9ecef;
}


  </style>
</head>
<body>
  <div class="slider-container">
    <!-- The main viewport wrapper -->
    <div class="slider-wrapper">
      <div class="slides">
        <!-- Substitute these with your own image URLs -->
        <img style="object-fit: contain;" height="300px" src="images/img-2.png" alt="Slide 1" class="slide">
        <img style="object-fit: contain;" height="300px" src="images/img-2.png" alt="Slide 2" class="slide">
        <img style="object-fit: contain;" height="300px" src="images/img-2.png" alt="Slide 3" class="slide">
        <img style="object-fit: contain;" height="300px" src="images/img-2.png" alt="Slide 4" class="slide">
      </div>
    </div>
  
    <!-- Arrow Navigation Icons -->
    <button class="arrow-btn prev" aria-label="Previous Slide">&#10094;</button>
    <button class="arrow-btn next" aria-label="Next Slide">&#10095;</button>
  
    <!-- Dot Navigation Indicators -->
    <div class="dots-container">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
      <span class="dot" data-index="3"></span>
    </div>
  </div>

  <!-- The HTML Structure -->
<div class="dropdown">
  <button class="dropdown-toggle" onclick="this.parentElement.classList.toggle('is-open')">
    Click to Toggle Menu
    <span class="arrow">▼</span>
  </button>
  
  <!-- This wrapper handles the grid animation -->
  <div class="dropdown-menu-wrapper">
    <!-- This internal div prevents content from clipping abruptly -->
    <div class="dropdown-menu-content">
      <a href="#link1" class="dropdown-item">Profile Link</a>
      <a href="#link2" class="dropdown-item">Account Settings</a>
      <a href="#link3" class="dropdown-item">Help & Support</a>
      <a href="#link4" class="dropdown-item">Log Out</a>
    </div>
  </div>
</div>


  <script>
    const slides = document.querySelector('.slides');
    const slideImages = document.querySelectorAll('.slide');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    const dots = document.querySelectorAll('.dot');

    let currentIndex = 0;
    const totalSlides = slideImages.length;

    // Updates the slider position and dot visibility states
    function updateSlider() {
      // Translate the row horizontally based on the current active index
      slides.style.transform = `translateX(-${currentIndex * 100}%)`;
      
      // Toggle the active styling for dots
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });
    }

    // Arrow click triggers
    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % totalSlides; // Loops back to start
      updateSlider();
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + totalSlides) % totalSlides; // Loops to end if at index 0
      updateSlider();
    });

    // Dot click triggers
    dots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        currentIndex = parseInt(e.target.getAttribute('data-index'));
        updateSlider();
      });
    });
  </script>
</body>
</html>
